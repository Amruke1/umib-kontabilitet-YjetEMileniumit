name: Build and role permissions

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roles-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: mini_erp_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mini_erp_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MINIERP_TEST_DATABASE_CONNECTION: Host=localhost;Port=5432;Database=mini_erp_tests;Username=postgres;Password=${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: dotnet test MiniERP.sln --configuration Release --logger 'console;verbosity=normal'
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build && npm run lint
        working-directory: frontend
